services:
  - type: web
    name: the-premiums-society
    runtime: node
    plan: free
    region: singapore # or oregon, frankfurt
    buildCommand: npm install --include=dev && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./prisma/the_premiums.db
